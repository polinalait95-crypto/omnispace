[package]
name = "omnispace"
version = "0.1.0"
description = "Личный AI-ассистент для задач, знаний и финансов"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# bundled: компилирует SQLite внутрь бинаря (с FTS5 и JSON1),
# никаких системных библиотек — одинаково на Windows и macOS Intel.
rusqlite = { version = "0.31", features = ["bundled"] }

[features]
# Пустая заглушка под кастомный протокол Tauri (заполнит tauri-cli).
custom-protocol = ["tauri/custom-protocol"]
