name: Проверка

# Быстрая проверка на каждый push и pull request в main — ловит поломки
# до выпуска тега. Полную сборку установщиков делает release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Фронтенд (типы + сборка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установить зависимости
        run: npm install
      - name: Проверка типов
        run: npx tsc --noEmit
      - name: Сборка фронтенда
        run: npm run build

  rust:
    name: Rust (компиляция)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # dist нужен, т.к. generate_context!() встраивает фронтенд при компиляции
      - name: Собрать фронтенд (dist)
        run: |
          npm install
          npm run build

      - name: Системные зависимости Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Проверка компиляции
        run: cargo check --manifest-path src-tauri/Cargo.toml
